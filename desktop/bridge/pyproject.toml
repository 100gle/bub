[project]
name = "bub-desktop"
version = "0.1.0"
description = "Desktop (GPUI) bridge plugin for Bub."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.entry-points.bub]
bub-desktop = "bub_desktop:BubDesktopPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bub_desktop"]
