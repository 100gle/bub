name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: j178/prek-action@v1

  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Check typing
        run: uv run mypy



  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.21.0
          runtime: node@24.19.0
          package-json-file: website/package.json
          cache: true
          cache-dependency-path: website/pnpm-lock.yaml
          install: false

      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Validate dependency health
        run: |
          pnpm --dir website peers check
          pnpm --dir website audit --audit-level=low

      - name: Type-check the website
        run: pnpm --dir website check

      - name: Build the website
        run: pnpm --dir website build

      - name: Verify routes, search, feeds, and metadata
        run: pnpm --dir website verify:build

      - name: Validate the Cloudflare deployment
        run: pnpm --dir website verify:deploy

      - name: Smoke-test the Cloudflare preview
        run: pnpm --dir website test:preview
